name: Verify exact native PR AIR regressions

on:
  workflow_dispatch:
  push:
    branches: [test/air-regressions]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: native-air-regressions-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON: /usr/bin/python3
  NATIVE_SOURCE_COMMIT: dafba7961f82e23a2b55dde6d2303b2d345dad06
  NATIVE_SOURCE_TREE: c62dcc4b7b55f5c08b3fbcc6cd3a6a86b6863cb5
  PYTHONDONTWRITEBYTECODE: "1"
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPILERCHECK: content

jobs:
  focused-lit:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - name: Check out the exact native PR source and pinned SPIR-V submodule
        timeout-minutes: 5
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: dafba7961f82e23a2b55dde6d2303b2d345dad06
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
      - name: Install native build tools
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/floor-native-test-reports"
          printf 'CCACHE_DIR=%s/floor-native-ccache\nNATIVE_BUILD=%s/floor-native-build\nTEST_REPORTS=%s/floor-native-test-reports\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake ninja-build ccache python3 python3-psutil
      - name: Restore focused native compiler object cache
        timeout-minutes: 5
        id: objects
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/floor-native-ccache
          key: floor-native-lit-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: floor-native-lit-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Verify exact source identity and prepare pinned SPIR-V headers
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p "$TEST_REPORTS"
          test "$(git rev-parse HEAD)" = "$NATIVE_SOURCE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$NATIVE_SOURCE_TREE"
          git diff --exit-code
          git diff --cached --exit-code
          spirv_ref="$(git ls-tree HEAD llvm/projects/spirv | awk '{print $3}')"
          test "$(git -C llvm/projects/spirv rev-parse HEAD)" = "$spirv_ref"
          headers_ref="$(tr -d '[:space:]' < llvm/projects/spirv/spirv-headers-tag.conf)"
          [[ "$headers_ref" =~ ^[a-f0-9]{40}$ ]]
          git init "$RUNNER_TEMP/spirv-headers"
          git -C "$RUNNER_TEMP/spirv-headers" remote add origin https://github.com/KhronosGroup/SPIRV-Headers.git
          git -C "$RUNNER_TEMP/spirv-headers" fetch --depth 1 origin "$headers_ref"
          git -C "$RUNNER_TEMP/spirv-headers" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/spirv-headers" rev-parse HEAD)" = "$headers_ref"
          export SPIRV_COMMIT="$spirv_ref" SPIRV_HEADERS_COMMIT="$headers_ref"
          "$PYTHON" - <<'PY_SOURCE'
          import json, os
          from pathlib import Path
          report = {
              'repository': os.environ['GITHUB_REPOSITORY'],
              'sourceCommit': os.environ['NATIVE_SOURCE_COMMIT'],
              'sourceTree': os.environ['NATIVE_SOURCE_TREE'],
              'workflowCommit': os.environ['GITHUB_SHA'],
              'workflowRef': os.environ['GITHUB_WORKFLOW_REF'],
              'runId': os.environ['GITHUB_RUN_ID'],
              'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'spirvCommit': os.environ['SPIRV_COMMIT'],
              'spirvHeadersCommit': os.environ['SPIRV_HEADERS_COMMIT'],
          }
          (Path(os.environ['TEST_REPORTS']) / 'source-provenance.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY_SOURCE
          { c++ --version; cmake --version; ninja --version; df -h "$RUNNER_TEMP"; free -h; } \
            > "$TEST_REPORTS/build-inputs.txt"
      - name: Configure focused native compiler and upstream lit
        timeout-minutes: 10
        run: |
          set -euo pipefail
          jobs="$("$PYTHON" - <<'PY'
          import os
          memory = os.sysconf('SC_PAGE_SIZE') * os.sysconf('SC_PHYS_PAGES')
          print(max(1, min(4, os.cpu_count() or 1, memory // (2 * 1024**3))))
          PY
          )"
          echo "COMPILER_JOBS=$jobs" >> "$GITHUB_ENV"
          ccache --zero-stats
          cmake -S llvm -B "$NATIVE_BUILD" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE="$PYTHON" \
            '-DCMAKE_C_FLAGS_RELEASE=-O1 -DNDEBUG' \
            '-DCMAKE_CXX_FLAGS_RELEASE=-O1 -DNDEBUG' \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_ENABLE_PROJECTS=clang \
            -DLLVM_TARGETS_TO_BUILD= \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_INCLUDE_TESTS=ON \
            -DCLANG_INCLUDE_TESTS=ON \
            -DLLVM_INCLUDE_UTILS=ON \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_LIBPFM=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_CURL=OFF \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF \
            -DLLVM_SPIRV_INCLUDE_TESTS=OFF \
            -DLLVM_EXTERNAL_SPIRV_HEADERS_SOURCE_DIR="$RUNNER_TEMP/spirv-headers" \
            -DLLVM_PARALLEL_COMPILE_JOBS="$jobs" \
            -DLLVM_PARALLEL_LINK_JOBS=1 \
            2>&1 | tee "$TEST_REPORTS/configure.log"
      - name: Build only the tools needed by the focused tests
        timeout-minutes: 150
        id: build
        run: |
          set -euo pipefail
          cmake --build "$NATIVE_BUILD" --parallel "$COMPILER_JOBS" \
            --target clang opt FileCheck split-file count not llvm-config -- -k 0 \
            2>&1 | tee "$TEST_REPORTS/build.log"
          ccache --show-stats | tee "$TEST_REPORTS/ccache.txt"
      - name: Save compiler objects even if a later regression fails
        timeout-minutes: 5
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.objects.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/floor-native-ccache
          key: ${{ steps.objects.outputs.cache-primary-key }}
      - name: Run all twelve exact-PR AIR regressions and reject skips
        id: focused
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          unset LIT_OPTS LIT_FILTER LIT_FILTER_OUT LIT_XFAIL LIT_XFAIL_NOT LIT_NUM_SHARDS LIT_RUN_SHARD
          test "$(git rev-parse HEAD)" = "$NATIVE_SOURCE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$NATIVE_SOURCE_TREE"
          git diff --exit-code
          git diff --cached --exit-code
          tests=(
            clang/test/SemaCXX/metal-interface-attributes.cpp
            clang/test/SemaCXX/metal-member-address-spaces.cpp
            clang/test/CodeGenCXX/metal-interface-abi.cpp
            clang/test/CodeGenCXX/metal-record-layout.cpp
            clang/test/CodeGenCXX/metal-member-address-spaces.cpp
            clang/test/CodeGenCXX/metal-interface-errors.cpp
            clang/test/CodeGenCXX/metal-legacy-flat.cpp
            clang/test/CodeGenCXX/metal-function-constant-metadata-limits.ll
            clang/test/CodeGenCXX/metal-function-constants-per-entry.ll
            clang/test/CodeGenCXX/metal-function-constant-predicate-per-entry.ll
            llvm/test/Transforms/LibFloor/air-constant-vector-loads.ll
            llvm/test/Transforms/LibFloor/air-constant-vector-reject.ll
          )
          sha256sum "${tests[@]}" > "$TEST_REPORTS/test-sources.sha256"
          set +e
          timeout --signal=TERM --kill-after=30s 8m \
            "$PYTHON" "$NATIVE_BUILD/bin/llvm-lit" -v -j 2 --timeout=300 \
            --xunit-xml-output "$TEST_REPORTS/lit.xml" \
            -o "$TEST_REPORTS/lit.json" "${tests[@]}" \
            2>&1 | tee "$TEST_REPORTS/lit.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '[%s, %s]\n' "${statuses[@]}" > "$TEST_REPORTS/lit-exit-status.json"
          "$PYTHON" - "${tests[@]}" <<'PY_RESULT'
          import json, os, sys
          from pathlib import Path
          root = Path(os.environ['TEST_REPORTS'])
          expected = [('Clang' if path.startswith('clang/') else 'LLVM') + ' :: ' + path.split('/test/', 1)[1] for path in sys.argv[1:]]
          errors, tests = [], []
          if len(expected) != 12 or len(set(expected)) != 12:
              errors.append('Expected exactly twelve distinct AIR regressions')
          try:
              tests = json.loads((root / 'lit.json').read_text())['tests']
              names = [test['name'] for test in tests]
              if set(names) != set(expected) or len(names) != len(expected):
                  errors.append('Unexpected, duplicate or missing test results')
              if any(test['code'] != 'PASS' for test in tests):
                  errors.append('Every selected regression must execute and PASS; skips are not success')
          except (OSError, ValueError, KeyError, TypeError) as error:
              errors.append(f'Missing or invalid lit report: {error}')
          statuses = json.loads((root / 'lit-exit-status.json').read_text())
          if len(statuses) != 2 or any(statuses):
              errors.append('A test or logging process failed or timed out')
          summary = {
              'sourceCommit': os.environ['NATIVE_SOURCE_COMMIT'],
              'sourceTree': os.environ['NATIVE_SOURCE_TREE'],
              'workflowCommit': os.environ['GITHUB_SHA'],
              'scope': 'Twelve focused AIR regressions from the exact native PR source; not full-suite coverage',
              'expected': expected, 'reported': len(tests), 'exitStatus': statuses, 'errors': errors,
          }
          (root / 'focused-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(f"Native source: {summary['sourceCommit']}\n\nWorkflow commit: {summary['workflowCommit']}\n\n")
              output.write(summary['scope'] + '\n\n')
              output.write('FAILED: ' + '; '.join(errors) if errors else 'All twelve selected AIR regressions executed and passed')
          if errors: raise SystemExit(1)
          print('All twelve selected exact-PR AIR regressions executed and passed')
          PY_RESULT
      - name: Upload exact native PR build and regression results
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-pr-regression-results-${{ env.NATIVE_SOURCE_COMMIT }}-${{ github.sha }}
          path: ${{ runner.temp }}/floor-native-test-reports/
          if-no-files-found: warn
          retention-days: 7

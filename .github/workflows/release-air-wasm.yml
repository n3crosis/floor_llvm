name: Build AIR WASM

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional NEW prerelease tag (for example v0.2.0); leave empty to build artifacts only"
        required: false
        type: string
  push:
    branches: [wasm, wasm-rebased-functional-20261110]
    # Deliberate batch checkpoints only; ordinary pushes do not start CI.
    paths: [wasm/release/validation-checkpoint.json]

permissions:
  contents: read

concurrency:
  group: air-wasm-${{ inputs.release_version || github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  AIR_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}
  AIR_RELEASE_PUSH_BEFORE: ${{ github.event.before || '' }}

jobs:
  build:
    outputs:
      compiler_artifact_id: ${{ steps.compiler_artifact.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Check out the exact workflow source commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node 24 without package-manager caching
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Test build and release helper behavior
        run: |
          python3 -m unittest discover -s wasm/release -p 'test_*.py' -v
          python3 -m unittest discover -s wasm/release/gpu/texture -v
          node --test wasm/release/*.test.mjs
          node --test wasm/release/gpu/placement/*.test.mjs
          node --test wasm/release/gpu/barrier/*.test.mjs
          g++ -std=c++17 -Wall -Wextra -Werror wasm/api/tests/target-options.cpp -o "$RUNNER_TEMP/air-target-options-test"
          "$RUNNER_TEMP/air-target-options-test"
      - name: Resolve an explicit one-push release request
        if: ${{ github.event_name == 'push' }}
        run: python3 wasm/release/release.py resolve-request --work "$RUNNER_TEMP/air-release"
      - name: Verify source hashes and build resources
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 wasm/release/release.py preflight --work "$RUNNER_TEMP/air-release"
      - name: Prepare the pinned official Emscripten SDK
        run: |
          git clone --depth 1 --branch 4.0.20 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/air-emsdk"
          test "$(git -C "$RUNNER_TEMP/air-emsdk" rev-parse HEAD)" = e4fe26ef59168ff44f4c23c466e497bf60b3411e
      - name: Cache only official SDK downloads in this repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/air-emsdk/downloads
          key: air-emsdk-downloads-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu24-4.0.20-e4fe26ef59168ff44f4c23c466e497bf60b3411e
      - name: Prepare a bounded content-checked object cache
        id: objects_setup
        env:
          RECIPE_SHA: ${{ hashFiles('wasm/build.mjs', 'wasm/api/CMakeLists.txt') }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ccache cmake ninja-build
          cat > "$RUNNER_TEMP/air-ccache.conf" <<EOF
          cache_dir = $RUNNER_TEMP/air-ccache
          max_size = 2GiB
          compiler_check = content
          direct_mode = false
          depend_mode = false
          sloppiness =
          remote_storage =
          EOF
          ccache_sha="$(sha256sum /usr/bin/ccache | cut -d ' ' -f1)"
          [[ "$ccache_sha" =~ ^[a-f0-9]{64}$ ]]
          printf 'prefix=air-objects-v1-Linux-X64-ubuntu24-emsdk4.0.20-e4fe26ef-%s-%s-\n' "$RECIPE_SHA" "$ccache_sha" >> "$GITHUB_OUTPUT"
      - name: Restore same-repository compatible compiler objects, not finished binaries
        id: objects
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/air-ccache
          key: ${{ steps.objects_setup.outputs.prefix }}${{ steps.source.outputs.source_fingerprint }}
          restore-keys: ${{ steps.objects_setup.outputs.prefix }}
      - name: Build the compiler and require fresh ABI/header/smoke probes
        id: build
        env:
          EMSDK_KEEP_DOWNLOADS: "1"
          CCACHE_CONFIGPATH: ${{ runner.temp }}/air-ccache.conf
          EM_COMPILER_WRAPPER: /usr/bin/ccache
        run: |
          "$RUNNER_TEMP/air-emsdk/emsdk" install 4.0.20
          "$RUNNER_TEMP/air-emsdk/emsdk" activate 4.0.20
          source "$RUNNER_TEMP/air-emsdk/emsdk_env.sh"
          emcc --version | grep -E '^emcc .* 4[.]0[.]20([[:space:]]|$)'
          /usr/bin/ccache --zero-stats
          python3 wasm/release/release.py build --work "$RUNNER_TEMP/air-release"
          /usr/bin/ccache --cleanup
          /usr/bin/ccache --show-stats
      - name: Save objects only after compiler validation succeeds
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.objects.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/air-ccache
          key: ${{ steps.objects.outputs.cache-primary-key }}
      - name: Package the exact source commit, runtime and build-input disclosure
        run: python3 wasm/release/release.py package --work "$RUNNER_TEMP/air-release"
      - name: Upload verified compiler artifacts
        id: compiler_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: air-wasm-${{ steps.source.outputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/air-release/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: false
      - name: Publish only an explicitly requested new prerelease
        if: ${{ env.AIR_RELEASE_VERSION != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 wasm/release/release.py publish --work "$RUNNER_TEMP/air-release"

  apple_reference:
    needs: build
    runs-on: xcode-27
    # Separate bounded feature matrices need time even after an earlier failure.
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Check out the exact workflow source commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Download the immutable artifact produced by this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.compiler_artifact_id }}
          path: ${{ runner.temp }}/compiler-artifact
          merge-multiple: true
      - name: Select the highest installed Xcode 27 or newer
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, re, subprocess
          candidates = []
          for path in glob.glob('/Applications/Xcode*.app/Contents/Developer'):
              env = dict(os.environ, DEVELOPER_DIR=path)
              p = subprocess.run(['xcodebuild', '-version'], env=env, text=True, capture_output=True)
              m = re.search(r'^Xcode (\d+(?:\.\d+)*)', p.stdout)
              if p.returncode == 0 and m and int(m[1].split('.')[0]) >= 27:
                  candidates.append((tuple(map(int,m[1].split('.'))),path))
          assert candidates, 'Xcode 27+ unavailable; no older-toolchain fallback'
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('DEVELOPER_DIR='+max(candidates)[1]+'\n')
          PY
      - name: Verify manifest, exact commit, runtime hashes and header identity
        id: verify_runtime
        run: python3 wasm/release/verify-apple-runtime.py "$RUNNER_TEMP/compiler-artifact" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/verified-runtime" "$GITHUB_SHA"
      - name: Compile the optional Metal numerical probe
        run: xcrun -sdk macosx swiftc wasm/release/metal-numerical.swift -framework Metal -framework Foundation -o "$RUNNER_TEMP/metal-numerical"
      - name: Compare same-source Apple acceptance and FLOOR compilation
        if: ${{ always() && steps.verify_runtime.outcome == 'success' }}
        run: node wasm/release/apple-reference.mjs "$RUNNER_TEMP/verified-runtime" "$RUNNER_TEMP/apple-reference" --gpu-probe "$RUNNER_TEMP/metal-numerical"
      - name: Compare sampler-read GPU results independently of prior failures
        if: ${{ always() && steps.verify_runtime.outcome == 'success' }}
        shell: bash
        run: |
          HOST="$RUNNER_TEMP/apple-reference/texture-host"
          mkdir -p "$HOST"
          set +e
          xcrun -sdk macosx swiftc -O wasm/release/gpu/texture/metal-texture-read-numerical.swift -framework Metal -o "$HOST/texture-probe" > "$HOST/swift.stdout.txt" 2> "$HOST/swift.stderr.txt"
          SWIFT_STATUS=$?
          python3 - "$SWIFT_STATUS" "$HOST" <<'PYHOST'
          import hashlib, json, pathlib, sys
          status, out = int(sys.argv[1]), pathlib.Path(sys.argv[2])
          source = pathlib.Path('wasm/release/gpu/texture/metal-texture-read-numerical.swift')
          binary = out / 'texture-probe'
          result = {'schemaVersion': 1, 'phase': 'swift_compilation', 'status': 'passed' if status == 0 else 'failed', 'exitCode': status, 'sourceSha256': hashlib.sha256(source.read_bytes()).hexdigest(), 'gpuExecution': 'not_run'}
          if binary.is_file(): result['executableSha256'] = hashlib.sha256(binary.read_bytes()).hexdigest()
          (out / 'build.json').write_text(json.dumps(result, indent=2) + '\n')
          PYHOST
          python3 wasm/release/gpu/texture/run_texture_read_gpu_matrix.py --compile-dir "$RUNNER_TEMP/apple-reference" --harness "$HOST/texture-probe" --output "$RUNNER_TEMP/apple-reference/texture-gpu"
          GPU_STATUS=$?
          if [ "$SWIFT_STATUS" -ne 0 ]; then exit "$SWIFT_STATUS"; fi
          exit "$GPU_STATUS"
      - name: Compare placement GPU results independently of prior failures
        if: ${{ always() && steps.verify_runtime.outcome == 'success' }}
        shell: bash
        run: |
          HOST="$RUNNER_TEMP/apple-reference/placement-host"
          mkdir -p "$HOST"
          set +e
          xcrun -sdk macosx swiftc wasm/release/gpu/placement/metal-placement-numerical.swift -framework Metal -o "$HOST/placement-probe" > "$HOST/swift.stdout.txt" 2> "$HOST/swift.stderr.txt"
          SWIFT_STATUS=$?
          python3 - "$SWIFT_STATUS" "$HOST" <<'PYHOST'
          import hashlib, json, pathlib, sys
          status, out = int(sys.argv[1]), pathlib.Path(sys.argv[2])
          source = pathlib.Path('wasm/release/gpu/placement/metal-placement-numerical.swift')
          binary = out / 'placement-probe'
          result = {'schemaVersion': 1, 'phase': 'swift_compilation', 'status': 'passed' if status == 0 else 'failed', 'exitCode': status, 'sourceSha256': hashlib.sha256(source.read_bytes()).hexdigest(), 'gpuExecution': 'not_run'}
          if binary.is_file(): result['executableSha256'] = hashlib.sha256(binary.read_bytes()).hexdigest()
          (out / 'build.json').write_text(json.dumps(result, indent=2) + '\n')
          PYHOST
          node wasm/release/gpu/placement/run-placement-matrix.mjs --reference-directory "$RUNNER_TEMP/apple-reference" --harness "$HOST/placement-probe" --output "$RUNNER_TEMP/apple-reference/placement-gpu" --timeout-ms 180000
          GPU_STATUS=$?
          if [ "$SWIFT_STATUS" -ne 0 ]; then exit "$SWIFT_STATUS"; fi
          exit "$GPU_STATUS"
      - name: Compare barrier GPU results independently of prior failures
        if: ${{ always() && steps.verify_runtime.outcome == 'success' }}
        shell: bash
        run: |
          HOST="$RUNNER_TEMP/apple-reference/barrier-host"
          mkdir -p "$HOST"
          set +e
          xcrun -sdk macosx swiftc -O wasm/release/metal-barrier-gpu.swift -framework Metal -o "$HOST/barrier-probe" > "$HOST/swift.stdout.txt" 2> "$HOST/swift.stderr.txt"
          SWIFT_STATUS=$?
          python3 - "$SWIFT_STATUS" "$HOST" <<'PYHOST'
          import hashlib, json, pathlib, sys
          status, out = int(sys.argv[1]), pathlib.Path(sys.argv[2])
          source = pathlib.Path('wasm/release/metal-barrier-gpu.swift')
          binary = out / 'barrier-probe'
          result = {'schemaVersion': 1, 'phase': 'swift_compilation', 'status': 'passed' if status == 0 else 'failed', 'exitCode': status, 'sourceSha256': hashlib.sha256(source.read_bytes()).hexdigest(), 'gpuExecution': 'not_run'}
          if binary.is_file(): result['executableSha256'] = hashlib.sha256(binary.read_bytes()).hexdigest()
          (out / 'build.json').write_text(json.dumps(result, indent=2) + '\n')
          PYHOST
          node wasm/release/gpu/barrier/run-barrier-matrix.mjs --reference-directory "$RUNNER_TEMP/apple-reference" --harness "$HOST/barrier-probe" --output "$RUNNER_TEMP/apple-reference/barrier-gpu" --timeout-ms 150000 --matrix-timeout-ms 1200000
          GPU_STATUS=$?
          if [ "$SWIFT_STATUS" -ne 0 ]; then exit "$SWIFT_STATUS"; fi
          exit "$GPU_STATUS"
      - name: Upload layered Apple reference evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apple-reference-${{ github.sha }}
          path: ${{ runner.temp }}/apple-reference
          if-no-files-found: warn
          retention-days: 30
          overwrite: false
